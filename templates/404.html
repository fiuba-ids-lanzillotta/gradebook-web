{% extends "base.html" %}

{% block title %}404 · Página no encontrada{% endblock %}

{% block content %}
    <section class="error-page">
        <div class="error-page__box">
            <p class="error-page__code">404</p>
            <h1 class="error-page__title">Página no encontrada</h1>
            <p class="error-page__text">
                {{ error.description if error and error.description else 'La página que buscás no existe o fue movida.' }}
            </p>
            <a href="{{ url_for('web.site.home.index') }}" class="btn btn--primary">Volver al inicio</a>
        </div>
    </section>
{% endblock %}
