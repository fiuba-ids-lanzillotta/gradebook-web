{% extends "base.html" %}

{% block navbar_menu %}{% endblock %}

{% block title %}Login · Panel Gradebook{% endblock %}

{% block content %}
<section class="login">
    <div class="login__card">
        <h1 class="login__title">Panel de administración</h1>
        <p class="login__subtitle">Iniciá sesión para continuar</p>
        <hr class="login__divider">

        <form class="login__form" method="POST" action="{{ url_for('web.admin.auth.login') }}">
            {% if error %}
            <p class="login__error">{{ error }}</p>
            {% endif %}

            <label class="login__label" for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                class="login__input"
                placeholder="Ingresá tu usuario"
                autocomplete="username"
                required
            >

            <label class="login__label" for="password">Contraseña</label>
            <div class="login__field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="login__input"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    required
                >
                <button type="button" class="login__toggle-pass" id="toggle-password" aria-label="Mostrar contraseña">
                    Ver
                </button>
            </div>

            <button type="submit" class="btn btn--primary login__submit">Ingresar</button>
        </form>
    </div>
</section>
{% endblock %}
